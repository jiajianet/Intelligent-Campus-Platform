            border-radius: 12px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);

        .course-warn-title{
            font-size: 1.2em;
            font-weight: bold;
            width: 100%;
            display: flex;

        }
        .course-warn-list{
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 20px;
        }

        .btn-danger {
            background-color: #dc3545;
        }


        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
        .modal-dialog{
            max-width: 75%!important;
            max-height: 75%!important;

    <div class="modal" id="createCourseModal">
        <div class="modal-dialog shadow">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">创建课程</div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn square ghost" data-dismiss="modal"><span class="close"></span></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="course-name" class="col-form-label">请在下方输入课程信息<br/><br/>课程名：</label>
                            <input type="text" class="form-control" id="course-name">
                            <label for="course-intro" class="col-form-label"><br/>课程简介：</label>
                            <textarea id="course-intro" class="form-control" cols="5" rows="10"></textarea>
                            <label for="course-startDate" class="col-form-label"><br/>课程开始日期：</label>
                            <input type="text" id="course-startDate" class="form-control">
                            <label for="course-endDate" class="col-form-label"><br/>课程结束日期：</label>
                            <input type="text" id="course-endDate" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" data-dismiss="modal">取消</button>
                    <button type="button" class="btn primary" id="btnCreateCourseOkVerify">创建课程</button>
                </div>
            </div>
        </div>
    </div>
