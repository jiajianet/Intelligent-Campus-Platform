  <div class="toast-container position-absolute p-3 top-0 start-50 translate-middle-x toast-set">

  <div class="toast-container position-absolute p-3 top-0 start-50 translate-middle-x toast-set">

  <section class="w3l-form-36">
    <div class="form-main section-gap">
      <div class="wrapper">
        <div class="form-inner-cont">
          <h3 style="font-weight: bold;">用户登录</h3>
          <form action="#" method="post" class="signin-form" id="loginForm">
            <div class="form-group">
              <div class="form-input form-control">
                <span class="fa fa-user-o" aria-hidden="true"></span>
                <div class="col-lg-12">
                  <input type="text" id="uidInput" name="userID"
                         placeholder="请输入学号"
                         data-bv-message="学号无效"
                         required
                         data-bv-notempty-message="学号不能为空"
                         pattern="[0-9]+"
                         data-bv-regexp-message="学号只能包含数字" />
                </div>
              </div>

            </div>
            <div class="form-group">
              <div class="form-input form-control">
                <span class="fa fa-key" aria-hidden="true"></span>
              <div class="col-lg-12">
                <input type="password" id="passwdInput" name="userPassword"
                       placeholder="请输入密码"
                       required
                       data-bv-notempty-message="密码不能为空" />
              </div>
              </div>
            </div>
            <div class="login-remember d-grid">
              <label class="check-remaind">
                <input type="checkbox">
                <span class="checkmark"></span>
                <p class="remember">记住登录状态</p>
              </label>
              <button class="theme-button" type="button" id="submitLogin">登录</button>
            </div>
            <div class="new-signup">
              <a href="./reset" class="signuplink">忘记密码？</a>
            </div>
          </form>
          <p class="signup">还没有账户？<a href="signup" class="signuplink">立即注册</a></p>
        </div>
      </div>
    </div>
    <div id="mpanel2" style="margin-top:50px;"></div>
  </section>
</body>
