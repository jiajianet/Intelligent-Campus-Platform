            <div class="form-input">
              <span class="fa fa-user-o" aria-hidden="true"></span> <input type="text" id="uidInput" name="userID"

            </div>
            <div class="form-input">
              <span class="fa fa-key" aria-hidden="true"></span> <input type="password" id="passwdInput"
                name="userPassword" placeholder="请输入密码" required="required" />
            </div>
            <div class="login-remember d-grid">
              <label class="check-remaind">
                <input type="checkbox">
                <span class="checkmark"></span>
                <p class="remember">记住登录状态</p>
              </label>
              <button class="theme-button" type="button" id="submitLogin">登录</button>
            </div>
            <div class="new-signup">
              <a href="#reload" class="signuplink">忘记密码？</a>
