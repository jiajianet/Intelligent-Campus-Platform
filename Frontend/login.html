<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录——智慧校园服务平台</title>
  <link rel="stylesheet" href="assets/css/login.css" type="text/css" media="all" /><!-- Style-CSS -->
  <link href="https://s4.zstatic.net/ajax/libs/font-awesome/6.6.0/css/fontawesome.min.css" rel="stylesheet">
  <script defer src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
  <script defer src="https://s4.zstatic.net/ajax/libs/font-awesome/6.6.0/js/v4-shims.min.js"></script>

</head>
<body>
<section class="w3l-form-36">
  <div class="form-main section-gap">
    <div class="wrapper">
      <div class="form-inner-cont">
        <h3>用户登录</h3>
        <form action="#" method="post" class="signin-form">
          <div class="form-input">
            <span class="fa fa-user-o" aria-hidden="true"></span> <input type="text" name="userID"
                                                                             placeholder="请输入学号" required />
          </div>
          <div class="form-input">
            <span class="fa fa-key" aria-hidden="true"></span> <input type="password" name="userPassword" placeholder="请输入密码"
                                                                      required />
          </div>
          <div class="login-remember d-grid">
            <label class="check-remaind">
              <input type="checkbox">
              <span class="checkmark"></span>
              <p class="remember">记住登录状态</p>
            </label>
            <button class="btn theme-button">登录</button>
          </div>
          <div class="new-signup">
            <a href="#reload" class="signuplink">忘记密码？</a>
          </div>
        </form>
        <!--
        <div class="social-icons">
          <p class="continue"><span>Or</span></p>
          <div class="social-login">
            <a href="#facebook">
              <div class="facebook">
                <span class="fa fa-facebook" aria-hidden="true"></span>

              </div>
            </a>
            <a href="#google">
              <div class="google">
                <span class="fa fa-google-plus" aria-hidden="true"></span>
              </div>
            </a>
          </div>
        </div>-->
        <p class="signup">还没有账户？<a href="#signup.html" class="signuplink">立即注册</a></p>
      </div>
    </div>
  </div>
</section>
</body>
</html>
