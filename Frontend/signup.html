  <section class="w3l-form-36">
    <div class="form-main section-gap">
      <div class="wrapper">
        <div class="form-inner-cont">
          <h3 style="font-weight: bold;">用户注册</h3>
          <form action="#" method="post" class="signin-form">
            <div class="form-input">
              <span class="fa fa-school" aria-hidden="true"></span> <input type="text" name="userSchool" id="userSchool"
                placeholder="请输入学校" required />
            </div>
            <div class="form-input">
              <span class="fa fa-id-card-o" aria-hidden="true"></span> <input type="text" name="userID" id="uidInput"
                placeholder="请输入学号" required />
            </div>
            <div class="form-input">
              <span class="fa fa-user-o" aria-hidden="true"></span> <input type="text" name="userName" id="unameInput"
                placeholder="请设置用户名" required />
            </div>
            <div class="form-input">
              <span class="fa fa-key" aria-hidden="true"></span> <input type="password" name="userPasswordA"
                id="userPasswordA" placeholder="请设置密码" required />
            </div>
            <div class="form-input">
              <span class="fa fa-key" aria-hidden="true"></span> <input type="password" name="userPasswordB"
                id="userPasswordB" placeholder="请再次设置密码" required />
            </div>
            <div class="form-input">
              <span class="fa fa-envelope" aria-hidden="true"></span> <input type="text" name="email" id="inputEmail" placeholder="请输入邮箱" required />
            </div>
            <div class="form-input" style="display:flex!important;">
              <span class="fa fa-shield-halved" aria-hidden="true"></span> <input type="text" name="email" id="inputCode" placeholder="请输入验证码" style="margin: 0 0 0 12px" required />
              <div class="email-code-btn" >
                <button class="theme-button" type="button" id="sendEmail" style="border: none;background: none;color:#4154f1">发送验证码</button>
              </div>
            </div>

            <div class="login-remember d-grid">

              <button class="theme-button" type="button" id="submitRegister">注册</button>
            </div>
          </form>
