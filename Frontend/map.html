<script type="text/javascript">
  function initMap() {
    var center = new TMap.LatLng(23.450633,113.494900);
    // 初始化地图
    var map = new TMap.Map("container", {
      rotation: -10, // 设置地图旋转角度
      pitch: 45, // 设置俯仰角度（0~45）
      zoom: 18, // 设置地图缩放级别
      center: center // 设置地图中心点坐标
    });
  }
</script>
