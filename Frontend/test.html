<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线学习平台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .section-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .course-list {
            list-style: none;
            padding: 0;
        }
        .course-item {
            background-color: white;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .course-title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .course-instructor {
            margin-bottom: 5px;
        }
        .progress-bar {
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            height: 10px;
        }
        .progress-bar div {
            background-color: #007bff;
            height: 100%;
            width: 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            text-align: center;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
        }
    </style>
</head>
<body>
<header>
    <h1>在线学习平台</h1>
</header>
<div class="container">
    <h2 class="section-title">共享学分课</h2>
    <ul class="course-list">
        <li class="course-item">
            <div class="course-title">情商认知与提升</div>
            <div class="course-instructor">张亚歌 - 河南大学</div>
            <div class="progress-bar">
                <div style="width: 0%;"></div>
            </div>
            <button class="btn">选择</button>
            <button class="btn">加入课程</button>
        </li>
    </ul>

    <h2 class="section-title">翻转课</h2>
    <ul class="course-list">
        <li class="course-item">
            <div class="course-title">2024-2025第一学期马克思主义基本原理</div>
            <div class="course-instructor">陈俊荣, 陈子怡, 黄长平, 鲁鲜亮, 吴小强, 蓝秋瑶, 黄文洁, 陈晶晶, 沈俐颖, 黄秋冬</div>
            <div class="progress-bar">
                <div style="width: 0%;"></div>
            </div>
            <button class="btn">查看全部</button>
        </li>
    </ul>

    <h2 class="section-title">群文件管理</h2>
    <button class="btn">管理文件</button>
</div>
</body>
